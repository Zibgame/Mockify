<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Mockify — Automated Visual Production</title>
  <desc id="description">Pipeline automatisé avec file de tâches, workers parallèles, contrôle qualité et export.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c18"/>
      <stop offset="0.55" stop-color="#171335"/>
      <stop offset="1" stop-color="#3b176f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#d8b4fe" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.055"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#02040b" flood-opacity="0.48"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#background)"/>
  <circle cx="1100" cy="5" r="190" fill="#8b5cf6" fill-opacity="0.08"/>
  <circle cx="780" cy="380" r="220" fill="#22d3ee" fill-opacity="0.045"/>
  <path d="M0 310C170 265 335 350 505 308S880 252 1200 315V360H0Z" fill="#ffffff" fill-opacity="0.025"/>

  <!-- Brand -->
  <g transform="translate(66 62)">
    <rect width="64" height="64" rx="19" fill="url(#accent)"/>
    <path d="M15 45V19h10l7 12 7-12h10v26H39V31l-7 12-7-12v14z" fill="#111020"/>
    <circle cx="53" cy="11" r="5" fill="#86efac" stroke="#111020" stroke-width="3"/>

    <text x="0" y="132" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="760" letter-spacing="-2.5">Mockify</text>
    <text x="2" y="171" fill="#d8cfff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" letter-spacing="2">AUTOMATED VISUAL PRODUCTION</text>
    <text x="2" y="213" fill="#ffffff" fill-opacity="0.72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">From one input to production-ready assets.</text>

    <g transform="translate(2 238)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">
      <rect width="93" height="30" rx="15" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.3"/>
      <circle cx="17" cy="15" r="4" fill="#a78bfa"/>
      <text x="29" y="19" fill="#e9ddff">PARALLEL</text>

      <rect x="103" width="76" height="30" rx="15" fill="#d946ef" fill-opacity="0.15" stroke="#f0abfc" stroke-opacity="0.25"/>
      <path d="M118 15l5 5 9-10" fill="none" stroke="#f0abfc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="140" y="19" fill="#f8ddff">QC</text>

      <rect x="189" width="91" height="30" rx="15" fill="#22d3ee" fill-opacity="0.12" stroke="#67e8f9" stroke-opacity="0.25"/>
      <path d="M205 10v10m-4-4 4 4 4-4" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="219" y="19" fill="#d5f9ff">EXPORT</text>
    </g>
  </g>

  <!-- Automation dashboard -->
  <g transform="translate(490 38)" filter="url(#shadow)">
    <rect width="650" height="284" rx="25" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.14"/>

    <!-- Window header -->
    <circle cx="24" cy="23" r="4" fill="#fb7185"/>
    <circle cx="39" cy="23" r="4" fill="#facc15"/>
    <circle cx="54" cy="23" r="4" fill="#4ade80"/>
    <text x="77" y="28" fill="#ffffff" fill-opacity="0.62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">AUTOMATION PIPELINE</text>
    <rect x="531" y="13" width="98" height="22" rx="11" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.3"/>
    <circle cx="547" cy="24" r="4" fill="#4ade80"/>
    <text x="557" y="28" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">RUNNING</text>
    <line x1="0" y1="47" x2="650" y2="47" stroke="#ffffff" stroke-opacity="0.09"/>

    <!-- Main pipeline -->
    <path d="M95 110H185M279 110H368M462 110H545" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <g fill="#d8b4fe">
      <path d="M179 104l10 6-10 6z"/>
      <path d="M362 104l10 6-10 6z"/>
      <path d="M539 104l10 6-10 6z"/>
    </g>

    <!-- Input -->
    <g transform="translate(24 74)">
      <rect width="72" height="72" rx="18" fill="#8b5cf6" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.32"/>
      <path d="M24 25h24v23H24zM29 21h14" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="31" cy="32" r="3" fill="#f0abfc"/>
      <path d="M25 44l8-8 6 5 5-6 4 4" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="91" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">INPUT</text>
    </g>

    <!-- Queue -->
    <g transform="translate(188 74)">
      <rect width="92" height="72" rx="18" fill="#a855f7" fill-opacity="0.13" stroke="#c084fc" stroke-opacity="0.28"/>
      <g fill="#e9d5ff">
        <rect x="19" y="19" width="54" height="7" rx="3.5" fill-opacity="0.35"/>
        <rect x="19" y="33" width="43" height="7" rx="3.5" fill-opacity="0.6"/>
        <rect x="19" y="47" width="31" height="7" rx="3.5" fill-opacity="0.9"/>
      </g>
      <circle cx="76" cy="50" r="9" fill="#8b5cf6"/>
      <text x="76" y="54" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">4</text>
      <text x="46" y="91" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">AUTO QUEUE</text>
    </g>

    <!-- Parallel workers -->
    <g transform="translate(371 65)">
      <rect width="94" height="90" rx="20" fill="#d946ef" fill-opacity="0.11" stroke="#f0abfc" stroke-opacity="0.26"/>
      <g transform="translate(14 15)">
        <rect width="28" height="24" rx="7" fill="#d946ef" fill-opacity="0.45"/>
        <rect x="38" width="28" height="24" rx="7" fill="#8b5cf6" fill-opacity="0.58"/>
        <rect y="34" width="28" height="24" rx="7" fill="#22d3ee" fill-opacity="0.38"/>
        <rect x="38" y="34" width="28" height="24" rx="7" fill="#4ade80" fill-opacity="0.32"/>
        <g fill="#ffffff" fill-opacity="0.85">
          <circle cx="14" cy="12" r="3"/>
          <circle cx="52" cy="12" r="3"/>
          <circle cx="14" cy="46" r="3"/>
          <circle cx="52" cy="46" r="3"/>
        </g>
      </g>
      <text x="47" y="109" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">4 WORKERS</text>
    </g>

    <!-- QC -->
    <g transform="translate(548 74)">
      <rect width="76" height="72" rx="18" fill="#22d3ee" fill-opacity="0.1" stroke="#67e8f9" stroke-opacity="0.28"/>
      <circle cx="38" cy="36" r="19" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-opacity="0.5"/>
      <path d="M28 36l7 7 13-15" fill="none" stroke="#86efac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="91" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">AUTO QC</text>
    </g>

    <!-- Status rows -->
    <g transform="translate(24 190)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect width="602" height="70" rx="16" fill="#050814" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.07"/>
      <g transform="translate(18 15)">
        <circle cx="6" cy="6" r="4" fill="#4ade80"/>
        <text x="18" y="10" fill="#ffffff" fill-opacity="0.74" font-size="11">mockup_01.png</text>
        <rect x="130" width="74" height="18" rx="9" fill="#4ade80" fill-opacity="0.12"/>
        <text x="167" y="12" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">EXPORTED</text>

        <circle cx="257" cy="6" r="4" fill="#facc15"/>
        <text x="269" y="10" fill="#ffffff" fill-opacity="0.74" font-size="11">mockup_02.png</text>
        <rect x="381" width="66" height="18" rx="9" fill="#facc15" fill-opacity="0.12"/>
        <text x="414" y="12" text-anchor="middle" fill="#fde68a" font-size="9" font-weight="700">QC 82%</text>

        <circle cx="6" cy="35" r="4" fill="#a78bfa"/>
        <text x="18" y="39" fill="#ffffff" fill-opacity="0.74" font-size="11">mockup_03.png</text>
        <rect x="130" y="29" width="74" height="18" rx="9" fill="#8b5cf6" fill-opacity="0.15"/>
        <text x="167" y="41" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="700">WORKER 3</text>

        <circle cx="257" cy="35" r="4" fill="#22d3ee"/>
        <text x="269" y="39" fill="#ffffff" fill-opacity="0.74" font-size="11">outputs/run_042/</text>
        <rect x="381" y="29" width="90" height="18" rx="9" fill="#22d3ee" fill-opacity="0.1"/>
        <text x="426" y="41" text-anchor="middle" fill="#a5f3fc" font-size="9" font-weight="700">ORGANIZED</text>
      </g>
    </g>
  </g>
</svg>
