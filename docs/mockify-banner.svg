<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Mockify — Kindle Mockup Studio</title>
  <desc id="description">Bannière violette présentant une texture transformée en plusieurs mockups de coques Kindle.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17112d"/>
      <stop offset="0.52" stop-color="#442080"/>
      <stop offset="1" stop-color="#8a3ffc"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb6d9"/>
      <stop offset="0.5" stop-color="#ffda79"/>
      <stop offset="1" stop-color="#8ff0dc"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b0718" flood-opacity="0.38"/>
    </filter>
    <pattern id="pattern" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="28" height="28" fill="url(#art)"/>
      <circle cx="7" cy="7" r="4" fill="#ffffff" fill-opacity="0.62"/>
      <path d="M14 28L28 14" stroke="#6e3bd1" stroke-opacity="0.28" stroke-width="5"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="35" r="180" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="930" cy="335" r="145" fill="#ffb6d9" fill-opacity="0.07"/>

  <g transform="translate(76 70)">
    <rect x="0" y="0" width="58" height="58" rx="16" fill="#ffffff" fill-opacity="0.14"/>
    <path d="M15 40V18h8l7 11 7-11h8v22h-8V29l-7 10-7-10v11z" fill="#ffffff"/>
    <text x="0" y="113" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="750" letter-spacing="-2">Mockify</text>
    <text x="2" y="150" fill="#e8ddff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500">KINDLE MOCKUP STUDIO</text>
    <text x="2" y="194" fill="#ffffff" fill-opacity="0.76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Texture · Génération · Contrôle qualité · Export</text>
  </g>

  <g transform="translate(690 40)" filter="url(#shadow)">
    <g transform="translate(0 40) rotate(-8 90 120)">
      <rect width="180" height="240" rx="22" fill="#f7f3ff"/>
      <rect x="12" y="12" width="156" height="216" rx="14" fill="url(#pattern)"/>
      <circle cx="90" cy="219" r="3" fill="#4b3771" fill-opacity="0.6"/>
    </g>
    <g transform="translate(160 10) rotate(4 90 120)">
      <rect width="180" height="240" rx="22" fill="#ffffff"/>
      <rect x="12" y="12" width="156" height="216" rx="14" fill="url(#pattern)"/>
      <path d="M55 72c26-32 72-18 72 19 0 33-37 52-55 65-18-13-55-32-55-65 0-19 13-31 30-31 9 0 17 4 23 12z" fill="#ffffff" fill-opacity="0.72"/>
      <circle cx="90" cy="219" r="3" fill="#4b3771" fill-opacity="0.6"/>
    </g>
    <g transform="translate(325 48) rotate(9 90 120)">
      <rect width="180" height="240" rx="22" fill="#f7f3ff"/>
      <rect x="12" y="12" width="156" height="216" rx="14" fill="url(#pattern)"/>
      <path d="M48 45h84v104H48z" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="5"/>
      <circle cx="90" cy="219" r="3" fill="#4b3771" fill-opacity="0.6"/>
    </g>
  </g>
</svg>
